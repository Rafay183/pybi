[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybi-ray"
version = "0.1.0"
description = "Open-source business intelligence studio in Python - a Power BI style app: data modeling, DAX-style measures, interactive dashboards, sharing and exports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Rafay Shaikh" }]
maintainers = [{ name = "Muhammad Rafay Shaikh" }]
keywords = ["business intelligence", "bi", "dashboard", "power bi", "dax", "analytics", "data visualization", "reporting", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "pandas>=1.5",
    "flask>=2.2",
    "openpyxl>=3.0",
    "python-pptx>=0.6.21",
    "Pillow>=9.0",
    "requests>=2.25",
]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
files = ["pyarrow>=10", "xlrd", "pyxlsb", "odfpy", "fastavro", "pyreadstat", "tables", "pyyaml", "pdfplumber"]
sql = ["sqlalchemy>=2.0"]
postgres = ["sqlalchemy>=2.0", "psycopg2-binary"]
mysql = ["sqlalchemy>=2.0", "pymysql"]
sqlserver = ["sqlalchemy>=2.0", "pymssql"]
oracle = ["sqlalchemy>=2.0", "oracledb"]
snowflake = ["snowflake-sqlalchemy"]
bigquery = ["sqlalchemy-bigquery"]
databricks = ["databricks-sqlalchemy"]
duckdb = ["duckdb"]
odbc = ["pyodbc"]
nosql = ["pymongo", "redis", "boto3"]
cloud = ["fsspec", "s3fs", "gcsfs", "adlfs", "paramiko"]
finance = ["yfinance"]
all = ["pyarrow>=10", "xlrd", "pyxlsb", "odfpy", "fastavro", "pyreadstat", "pyyaml", "pdfplumber", "sqlalchemy>=2.0", "psycopg2-binary",
       "pymysql", "pymssql", "oracledb", "duckdb", "pymongo", "redis", "boto3", "fsspec", "s3fs", "gcsfs", "adlfs", "paramiko", "yfinance"]
dev = ["pytest>=7", "ruff>=0.6", "build", "twine", "reportlab", "pdfplumber"]

[project.urls]
Homepage = "https://github.com/rafay183/pybi"
Source = "https://github.com/rafay183/pybi"
Issues = "https://github.com/rafay183/pybi/issues"
Changelog = "https://github.com/rafay183/pybi/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rafay183/pybi#readme"

[project.scripts]
pybi = "pybi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pybi*"]

[tool.setuptools.package-data]
pybi = ["static/*"]

[tool.ruff]
line-length = 160
target-version = "py39"
extend-exclude = ["src/pybi/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "B008", "B904", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/pybi/connectors/catalog.py" = ["E241"]

[tool.pytest.ini_options]
testpaths = ["tests"]
