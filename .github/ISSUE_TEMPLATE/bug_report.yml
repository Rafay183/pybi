name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PyBI! Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pybi demo
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message / screenshot
      description: Terminal output, browser console (F12) errors, or a screenshot.
  - type: input
    id: version
    attributes:
      label: PyBI version
      description: Output of `pybi version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version and browser
      placeholder: Windows 11, Python 3.12, Chrome 130
    validations:
      required: true
